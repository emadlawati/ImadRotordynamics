# P-2616F one-shot coupling balance - site input
# ------------------------------------------------
# Fill in the [initial] readings (and [trial] after a trial run, if you do one),
# then run:   python -m p2616f.balance balancing_input.toml
#
# Conventions (see p2616f/balancing.py):
#   * probe / keyphasor angles: degrees from top dead centre, IN the direction of rotation
#   * phase: phase LAG (keyphasor pulse -> positive peak)
#   * weight angle: from keyphasor notch, AGAINST rotation (set weight_angle_with_rotation
#     = true if you measure with rotation)

# Proximity probes on a direct-coupled motor drive at 2980 rpm.
[machine]
condition = "process_1x"   # process_1x | process_2x | water_1x | dry
rpm = 2980

[balance_plane]
station = 111              # coupling hub (DyRoBeS station 111)
radius_mm = 100.0          # TODO: radius where the weight will be fitted on the coupling hub
weight_angle_with_rotation = false

[instrumentation]
measurement = "displacement"   # displacement (proximity probes) | velocity
amplitude_unit = "um_pp"       # um_pp | um_pk | mm_s_pk | mm_s_rms
keyphasor_angle_deg = 0.0      # TODO: keyphasor location, from TDC in direction of rotation

# Proximity probes. Example = API 670 X/Y at 45 deg either side of TDC, CW rotation
# viewed from the driver (X = 315, Y = 45). For CCW viewed from driver use X = 45, Y = 315.
[[probe]]
name = "NDE X"
station = 15
angle_deg = 315.0

[[probe]]
name = "NDE Y"
station = 15
angle_deg = 45.0

[[probe]]
name = "DE X"
station = 103
angle_deg = 315.0

[[probe]]
name = "DE Y"
station = 103
angle_deg = 45.0

# 1X readings before balancing: [amplitude, phase lag deg]
# PLACEHOLDER VALUES - replace with the site data.
[initial]
"NDE X" = [10.0, 120.0]
"NDE Y" = [10.0, 210.0]
"DE X" = [60.0, 100.0]
"DE Y" = [55.0, 190.0]

# Optional: relative weighting of probes in the least-squares solution
# [weights]
# "DE X" = 1.0

# Optional: after a trial run, uncomment and fill in to get the measured
# influence coefficients and compare them with the model.
# [trial]
# grams = 50.0
# angle_deg = 0.0
# "NDE X" = [0.0, 0.0]
# "NDE Y" = [0.0, 0.0]
# "DE X" = [0.0, 0.0]
# "DE Y" = [0.0, 0.0]

# Optional: flexible bearing pedestals (needed only for casing-mounted sensors;
# set probe location = "pedestal").  Values are assumptions - tune to site data.
# [pedestal]
# m = 300.0
# kxx = 5.0e8
# kyy = 1.0e9
# cxx = 5.0e4
# cyy = 5.0e4
